<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Wellness Events</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <a href="services.html">Services</a>
    <a href="about.html">About Us</a>
  </nav>

  <main class="home">
    <div id="montage-container" class="montage-container"></div>

    <!-- ✅ Visitor Counter -->
    <div id="visitor-counter" style="text-align:center; margin-top:20px; font-size:18px;">
      Loading visitors...
    </div>
  </main>

  <script src="js/main.js"></script>

  <!-- ✅ Visitor Tracking Script -->
  <script>
    async function loadVisitors() {
      try {
        const res = await fetch("https://utpwbrbpdyrwqlheaknm.supabase.co/functions/v1/track");
        const data = await res.json();

        document.getElementById("visitor-counter").innerText =
          "🌍 Unique Visitors: " + data.unique;
      } catch (err) {
        console.error(err);
        document.getElementById("visitor-counter").innerText =
          "Visitor counter unavailable";
      }
    }

    loadVisitors();
  </script>

</body>
</html>
