<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Wellness Events</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <a href="services.html">Services</a>
    <a href="about.html">About Us</a>
  </nav>

  <main class="home">
    <div id="montage-container" class="montage-container"></div>

    <!-- Visitor Counter -->
    <div id="visitor-counter" style="text-align:center; margin-top:20px; font-size:18px;">
      🌍 Loading visitors...
    </div>

    <!-- Debug info -->
    <pre id="visitor-debug" style="text-align:center; margin-top:10px; color:red;"></pre>
  </main>

  <script src="js/main.js"></script>

  <script>
async function loadVisitors() {
  const counterEl = document.getElementById("visitor-counter");
  const debugEl = document.getElementById("visitor-debug");

  try {
    const res = await fetch(
      "https://utpwbrbpdyrwqlheaknm.supabase.co/functions/v1/track",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" }
      }
    );

    const data = await res.json();

    if (data.error) {
      counterEl.innerText = "🌍 Visitors unavailable";
      debugEl.innerText = "Error: " + data.error;
    } else {
      counterEl.innerText = "🌍 Unique Visitors: " + (data.unique ?? 0);
      debugEl.innerText = "";
    }
  } catch (err) {
    console.error(err);
    counterEl.innerText = "🌍 Visitors unavailable";
    debugEl.innerText = "Fetch error: " + err.message;
  }
}

loadVisitors();
  </script>
</body>
</html>
