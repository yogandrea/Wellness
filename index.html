  <main class="home">
    <div id="montage-container" class="montage-container"></div>

    <!-- ✅ Visitor Counter -->
    <div id="visitor-counter" style="text-align:center; margin-top:20px; font-size:18px;">
      🌍 Loading visitors...
    </div>
  </main>

  <script src="js/main.js"></script>

  <!-- ✅ Visitor Tracking Script -->
 <script>
async function loadVisitors() {
  const counterEl = document.getElementById("visitor-counter");

  try {
    const res = await fetch(
      "https://utpwbrbpdyrwqlheaknm.supabase.co/functions/v1/track",
      {
        headers: {
          "apikey": "YOUR_SUPABASE_ANON_KEY"
        }
      }
    );

    const data = await res.json();

    counterEl.innerText = "🌍 Unique Visitors: " + (data.unique ?? 0);

  } catch (err) {
    console.error(err);
    counterEl.innerText = "🌍 Visitors unavailable";
  }
}

loadVisitors();
</script>

</body>
