<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule</title>
<link rel="stylesheet" href="css/style.css">

<style>

/* ===== Container for signup + gallery ===== */
.events-container{
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    justify-content:center;
    align-items:flex-start;
    margin-top:30px;
}

/* ===== Signup Box ===== */
.signup-box{
    flex:1 1 300px;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.signup-box input{
    width:95%;
    padding:10px;
    margin:8px 0;
}

.submit-btn{
    background:#4CAF50;
    color:white;
    border:none;
    padding:12px;
    width:95%;
    cursor:pointer;
}

.success{ margin-top:10px; font-weight:bold; }

/* ===== Gallery Wrapper ===== */
.gallery-wrapper{
    flex:2 1 500px;
}

/* ===== Gallery Layout ===== */
.gallery-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:15px;
}

.gallery-frame{
    width:100%;
    max-width:850px;
    height:min(70vh,520px);
    background:#111;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.gallery-frame img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
}

.gallery-container button{
    font-size:26px;
    padding:14px 18px;
    cursor:pointer;
    background:white;
    border-radius:50%;
    border:1px solid #ddd;
}

</style>
</head>

<body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="schedule.html">Schedule</a>
  <a href="services.html">Services</a>
  <a href="index.html#bookings">Bookings</a>
  <a href="about.html">About Us</a>
</nav>

<main class="schedule">

<div class="events-container">

  <!-- Registration Form -->
  <div class="signup-box">
    <h2>Register Interest</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <button class="submit-btn">Submit</button>
      <div class="success" id="msg"></div>
    </form>
  </div>

  <!-- Gallery -->
  <div class="gallery-wrapper">
    <h2>Event Gallery</h2>
    <div class="gallery-container">
      <button id="prevBtn">&#9664;</button>
      <div class="gallery-frame">
        <img id="galleryImage" alt="Event Photo">
      </div>
      <button id="nextBtn">&#9654;</button>
    </div>
  </div>

</div>

</main>

<script>
// ================= IMAGE GALLERY =================
const username = "yogandrea";
const repo     = "Wellness";
const folder   = "media/Events";
const apiURL   = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;

let images       = [];
let currentIndex = 0;

async function loadImages() {
  try {
    const res  = await fetch(apiURL);
    const data = await res.json();

    images = data
      .filter(f => f.name.toLowerCase().endsWith(".jpg"))
      .sort((a, b) => a.name.localeCompare(b.name)); // stable alphabetical order

    if (images.length === 0) return;
    showImage(0);
  } catch (err) {
    console.error("Failed to load gallery images:", err);
  }
}

function showImage(i) {
  const img = document.getElementById("galleryImage");
  if (images[i]) img.src = images[i].download_url;
}

document.getElementById("prevBtn").onclick = () => {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  showImage(currentIndex);
};
document.getElementById("nextBtn").onclick = () => {
  currentIndex = (currentIndex + 1) % images.length;
  showImage(currentIndex);
};

// Swipe support
let startX = 0;
const imgEl = document.getElementById("galleryImage");
imgEl.addEventListener("touchstart", e => { startX = e.touches[0].clientX; });
imgEl.addEventListener("touchend",   e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 40) {
    if (dx > 0) document.getElementById("prevBtn").click();
    else        document.getElementById("nextBtn").click();
  }
});

// Tap to fullscreen
imgEl.addEventListener("click", () => {
  if (imgEl.requestFullscreen) imgEl.requestFullscreen();
});

loadImages();

// ================= GOOGLE SHEET SUBMIT =================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynn2lIa8I--zwis12YttudV00gPyZXmAsW_m8h1z14o3zfj1ScMK76Q6ZKl7UySo1N/exec";

document.getElementById("signupForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const name  = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const msg   = document.getElementById("msg");

  if (!name || !email) {
    msg.innerText    = "Please fill all fields";
    msg.style.color  = "red";
    return;
  }

  msg.innerText   = "Submitting...";
  msg.style.color = "black";

  try {
    await fetch(SCRIPT_URL, {
      method:  "POST",
      mode:    "no-cors",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ name, email, page: "schedule" })
    });
    msg.innerText   = "Registration received ✔";
    msg.style.color = "green";
    this.reset();
  } catch (err) {
    msg.innerText   = "Submission failed ❌";
    msg.style.color = "red";
  }
});
</script>

</body>
</html>
