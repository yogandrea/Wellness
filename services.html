<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services &amp; Surveys</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Prevent booking-modal .modal-content styles from bleeding into form modal */
    #formModal .modal-content {
      all: unset;
      position: relative;
      width: min(900px, 96%);
      height: min(95dvh, 920px);
      background: white;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    /* Ensure the modal itself shows as flex when opened by JS */
    #formModal[style*="flex"] {
      display: flex !important;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <a href="services.html">Services</a>
    <a href="index.html#bookings">Bookings</a>
    <a href="about.html">About Us</a>
  </nav>

  <main class="services">
    <h1>Our Services &amp; Surveys</h1>
    <div id="servicesContainer" class="services-grid">
      <!-- Cards generated dynamically from media/forms.json -->
    </div>
  </main>

  <!-- Fullscreen Form Modal -->
  <div id="formModal" class="form-modal">
    <div class="form-header">
      <span id="closeForm">&#10005;</span>
    </div>
    <iframe id="formFrame"></iframe>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
